name: Build and Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: dotnet build .\Mockaco.sln --configuration Release --verbosity minimal
      - name: Test
        run: dotnet test .\Mockaco.sln --configuration Release --no-build --verbosity minimal
      - name: Test dashboard models
        run: node --test .\test\Mockaco.Analytics.Tests\dashboard.test.mjs
      - name: Publish collector
        run: dotnet publish .\src\Mockaco\Mockaco.csproj --configuration Release --no-build --output .\artifacts\collector
      - name: Publish atlas
        run: dotnet publish .\src\Mockaco.Analytics\Mockaco.Analytics.csproj --configuration Release --no-build --output .\artifacts\atlas
      - name: Upload applications
        uses: actions/upload-artifact@v4
        with:
          name: honeypot-and-atlas
          path: artifacts