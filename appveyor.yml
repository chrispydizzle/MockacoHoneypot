pull_requests:
  do_not_increment_build_number: true
image: Visual Studio 2022
init:
- ps: |
    Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:TEMP\dotnet-install.ps1"
    & "$env:TEMP\dotnet-install.ps1" -Channel 10.0 -InstallDir "$env:LOCALAPPDATA\Microsoft\dotnet"
    $env:PATH = "$env:LOCALAPPDATA\Microsoft\dotnet;$env:PATH"
configuration: Release
build_script:
- cmd: dotnet build .\Mockaco.sln -c Release
- cmd: dotnet publish .\src\Mockaco\Mockaco.csproj -c Release --no-build -o .\artifacts\collector
- cmd: dotnet publish .\src\Mockaco.Analytics\Mockaco.Analytics.csproj -c Release --no-build -o .\artifacts\atlas
test_script:
- cmd: dotnet test .\Mockaco.sln -c Release --no-build
- cmd: node --test .\test\Mockaco.Analytics.Tests\dashboard.test.mjs
artifacts:
- path: artifacts\collector
  name: Honeypot Collector
- path: artifacts\atlas
  name: Behavior Atlas